name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            directory: zig-x86_64-linux-0.16.0
          - name: macos-aarch64
            runner: macos-15
            url: https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz
            sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
            directory: zig-aarch64-macos-0.16.0
          - name: windows-x86_64
            runner: windows-2025
            url: https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
            sha256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
            directory: zig-x86_64-windows-0.16.0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install verified Zig 0.16.0 archive
        run: >-
          python .github/scripts/install-zig.py
          --url "${{ matrix.url }}"
          --sha256 "${{ matrix.sha256 }}"
          --directory "${{ matrix.directory }}"
      - name: Verify toolchain
        run: zig version
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src
      - name: Test
        run: zig build test --summary all
      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast
      - name: Cross-compile release binaries
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          for target in \
            x86_64-linux aarch64-linux \
            x86_64-macos aarch64-macos \
            x86_64-windows aarch64-windows
          do
            echo "Cross-compiling $target"
            zig build -Dtarget="$target" -Doptimize=ReleaseFast
          done
